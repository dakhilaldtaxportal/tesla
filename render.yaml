services:
  - type: web
    name: riders-group-bot
    runtime: python
    runtimeVersion: 3.11
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: riders-db
          property: connectionString
      - key: WEBHOOK_URL
        fromService:
          name: riders-group-bot
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: WEBHOOK_SECRET
        sync: false
      - key: CLAIM_TIMEOUT_SECONDS
        value: "120"
      - key: NORMAL_RADIUS_KM
        value: "1.0"
      - key: BROADCAST_RADIUS_KM
        value: "5.0"
      - key: PYTHONUNBUFFERED
        value: "true"

databases:
  - name: riders-db
    plan: free
